[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnia-llm"
version = "0.2.0"
description = "A lazy, token-guarded OpenAI-compatible gateway for self-hosted models, built for the Omnia Anki add-on"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "setproctitle>=1.3",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
# Each platform's engines, installed by scripts/install.sh <platform>. Versions for NVIDIA are
# pinned in the script: they depend on the machine's CUDA driver, not on this package.
apple = ["mlx-lm>=0.31"]
image = ["diffusers>=0.35", "transformers>=4.45", "accelerate", "torch", "pillow"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
omnia-llm = "omnia_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "B", "SIM", "I"]
ignore = ["SIM108", "SIM117"]
